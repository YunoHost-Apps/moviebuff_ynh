location / {

  proxy_pass http://127.0.0.1:__PORT__;
  proxy_redirect off;
  include proxy_params_no_auth;
  # YunoHost's server-wide header replaces the policy MovieBuff sends with each page
  more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";

  # Above the 8 MiB MovieBuff accepts for an imported history
  client_max_body_size 10M;

  # Kept for the time MovieBuff's Cache-Control allows; maps and zone in nginx-cache.conf
  proxy_cache __APP___ap;
  proxy_cache_key "$scheme://$host$request_uri $http_accept_language";
  proxy_cache_bypass $__APP___skip_cache $http_cookie;
  proxy_no_cache $__APP___skip_cache $http_cookie $__APP___not_json;
  # One copy per object: Signature only decides a refusal, answered with no-store
  proxy_ignore_headers Vary;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 8s;
  # No "updating": a deleted or narrowed post stops being served within two minutes
  proxy_cache_use_stale error timeout http_502 http_503 http_504;
  proxy_cache_background_update on;
}

location /static/ {
  alias __INSTALL_DIR__/staticfiles/;
  # YunoHost turns gzip off against BREACH; these files are public and hold no secret
  gzip on;
  gzip_types text/css application/javascript text/javascript image/svg+xml
             application/manifest+json;
  gzip_vary on;
  # A name carrying its content's hash never changes; the plain copies beside it do
  expires 1h;
  location ~ "\.[0-9a-f]{12}(\.[A-Za-z0-9]+)?$" {
    # expires would overwrite this header; an error (403 during an upgrade) is never kept
    expires off;
    more_set_headers "Cache-Control: public, max-age=31536000, immutable" -s "200 206 304";
  }
}
