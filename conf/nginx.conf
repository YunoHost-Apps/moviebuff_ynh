location / {

  proxy_pass http://127.0.0.1:__PORT__;
  proxy_redirect off;
  include proxy_params_no_auth;
  # YunoHost's server-wide header replaces the policy MovieBuff sends with each page
  more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";

  # Above the 8 MiB MovieBuff accepts for an imported history
  client_max_body_size 10M;
}

location /static/ {
  alias __INSTALL_DIR__/staticfiles/;
  expires 7d;
}
