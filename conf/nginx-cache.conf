# The ActivityPub cache of deploy/nginx/moviebuff.conf upstream, at the http level, named after
# the instance. A boost brings every follower's server for the same post within seconds.
map $http_accept $__APP___ap_accept {
    default 0;
    "~*(?:^|,)\s*application/activity\+json\s*(?:;[^,]*)?(?:,|$)|(?:^|,)\s*application/ld\+json\s*;[^,]*profile\s*=\s*\"?(?:[^\",]*\s)?https://www\.w3\.org/ns/activitystreams(?:[\s\";]|,|$)" 1;
}

# Objects and follow lists; never an outbox, which an accepted follower reads in full
map $uri $__APP___ap_object {
    default 0;
    "~^/users?/[^/]+/?$"                                         1;
    "~^/users/[^/]+/(?:followers|following)$"                    1;
    "~^/notes/[0-9a-f-]+$"                                       1;
    "~^/activities/[0-9a-f-]+$"                                  1;
    "~^/movies/details/[0-9]+/$"                                 1;
    "~^/tv/(?:show/[0-9]+/(?:season/[0-9]+/)?|episode/[0-9]+/)$" 1;
    "~^/lists/[0-9]+/$"                                          1;
}

map $uri $__APP___discovery {
    default 0;
    "~^/(?:\.well-known/(?:webfinger|nodeinfo)|nodeinfo/2\.[01])$" 1;
}

map "$request_method:$__APP___ap_accept$__APP___ap_object$__APP___discovery" $__APP___skip_cache {
    default 1;
    "~^(?:GET|HEAD):(?:11.|..1)$" 0;
}

# Only JSON is kept: a page answered at the same address never is
map $upstream_http_content_type $__APP___not_json {
    default 1;
    "~^application/(?:activity\+json|jrd\+json|json)" 0;
}

proxy_cache_path /var/cache/nginx/__APP__ levels=1:2 keys_zone=__APP___ap:10m
                 max_size=256m inactive=10m use_temp_path=off;
