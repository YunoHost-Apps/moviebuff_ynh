#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "Configuration"
name.fr = "Configuration"

# Each of them reads the .env only when it starts
services = ["__APP__", "__APP__-worker", "__APP__-peer-reads", "__APP__-beat"]

    [main.email]
    name.en = "E-mail"
    name.fr = "E-mail"
    help.en = "MovieBuff e-mails the confirmation of a new member's address, and its answer to a sign-up request or to a report sent from /about/report/. Without e-mail, these answers are read on a page instead, and signing up asks for no address confirmation. The administration documentation below says how to send a test e-mail."
    help.fr = "MovieBuff envoie par e-mail la confirmation de l'adresse d'un nouveau membre, et sa réponse à une demande d'inscription ou à un signalement fait depuis /about/report/. Sans e-mail, ces réponses se lisent sur une page, et l'inscription ne demande pas de confirmer l'adresse. La documentation d'administration ci-dessous explique comment envoyer un e-mail de test."

        [main.email.email_mode]
        ask.en = "Send e-mails"
        ask.fr = "Envoi des e-mails"
        type = "select"
        choices.none = "Never"
        choices.yunohost = "Through YunoHost's mail server"
        choices.custom = "Through another mail server"

        [main.email.mail_user]
        ask.en = "Sender name"
        ask.fr = "Nom d'expéditeur"
        help.en = "The part of the address before the @."
        help.fr = "La partie de l'adresse avant le @."
        type = "string"
        pattern.regexp = "^[a-z0-9][a-z0-9._-]*$"
        pattern.error = "Lowercase letters, digits, dots, hyphens and underscores only"
        visible = "email_mode == 'yunohost'"

        [main.email.mail_domain]
        ask.en = "Sender domain"
        ask.fr = "Domaine d'expédition"
        help.en = "A domain whose e-mail works, as YunoHost's diagnosis says."
        help.fr = "Un domaine dont l'e-mail fonctionne, d'après le diagnostic de YunoHost."
        type = "domain"
        visible = "email_mode == 'yunohost'"

        [main.email.email_host]
        ask.en = "Mail server (SMTP)"
        ask.fr = "Serveur mail (SMTP)"
        type = "string"
        example = "smtp.example.org"
        visible = "email_mode == 'custom'"

        [main.email.email_port]
        ask.en = "Port"
        ask.fr = "Port"
        help.en = "Usually 587 with STARTTLS, 465 with TLS."
        help.fr = "En général 587 avec STARTTLS, 465 avec TLS."
        type = "number"
        min = 1
        max = 65535
        visible = "email_mode == 'custom'"

        [main.email.email_security]
        ask.en = "Encryption"
        ask.fr = "Chiffrement"
        type = "select"
        choices.starttls = "STARTTLS"
        choices.ssl = "TLS"
        choices.none = "None"
        visible = "email_mode == 'custom'"

        [main.email.email_user]
        ask.en = "Username"
        ask.fr = "Identifiant"
        type = "string"
        optional = true
        visible = "email_mode == 'custom'"

        [main.email.email_password]
        ask.en = "Password"
        ask.fr = "Mot de passe"
        help.en = "Left empty, the one already saved is kept."
        help.fr = "Laissé vide, celui déjà enregistré est conservé."
        type = "password"
        optional = true
        visible = "email_mode == 'custom'"

        [main.email.email_from]
        ask.en = "Sender address"
        ask.fr = "Adresse d'expédition"
        help.en = "Many providers only accept the address of the account above. Leave empty for noreply@ followed by this app's domain."
        help.fr = "Beaucoup de fournisseurs n'acceptent que l'adresse du compte ci-dessus. Laisser vide pour noreply@ suivi du domaine de l'app."
        type = "email"
        optional = true
        visible = "email_mode == 'custom'"
