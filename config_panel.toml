#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "General"
name.fr = "Général"

# Each of them reads the .env only when it starts
services = ["__APP__", "__APP__-worker", "__APP__-peer-reads", "__APP__-beat"]

    [main.general]
    name.en = "General"
    name.fr = "Général"

        [main.general.tmdb_api_key]
        ask.en = "TMDB API key"
        ask.fr = "Clé d'API TMDB"
        help.en = "Left empty, the one already saved is kept."
        help.fr = "Laissée vide, celle déjà enregistrée est conservée."
        type = "password"
        optional = true

        [main.general.language]
        ask.en = "Language served to visitors whose browser asks for none of the available ones"
        ask.fr = "Langue servie aux visiteurs dont le navigateur ne demande aucune des langues disponibles"
        type = "select"
        choices.en = "English"
        choices.fr = "Français"

[email]
name.en = "E-mail"
name.fr = "E-mail"

services = ["__APP__", "__APP__-worker", "__APP__-peer-reads", "__APP__-beat"]

    [email.sending]
    name.en = "Sending"
    name.fr = "Envoi"
    help.en = "MovieBuff e-mails the confirmation of a new member's address, and its answer to a sign-up request or to a report sent from /about/report/. Without e-mail, these answers are read on a page instead, and signing up asks for no address confirmation."
    help.fr = "MovieBuff envoie par e-mail la confirmation de l'adresse d'un nouveau membre, et sa réponse à une demande d'inscription ou à un signalement fait depuis /about/report/. Sans e-mail, ces réponses se lisent sur une page, et l'inscription ne demande pas de confirmer l'adresse."

        [email.sending.email_mode]
        ask.en = "Send e-mails"
        ask.fr = "Envoi des e-mails"
        type = "select"
        choices.none = "Never"
        choices.yunohost = "Through YunoHost's mail server"
        choices.custom = "Through another mail server"

        [email.sending.mail_user]
        ask.en = "Sender name"
        ask.fr = "Nom d'expéditeur"
        help.en = "The part of the address before the @."
        help.fr = "La partie de l'adresse avant le @."
        type = "string"
        pattern.regexp = "^[a-z0-9][a-z0-9._-]*$"
        pattern.error = "Lowercase letters, digits, dots, hyphens and underscores only"
        visible = "email_mode == 'yunohost'"

        [email.sending.mail_domain]
        ask.en = "Sender domain"
        ask.fr = "Domaine d'expédition"
        help.en = "A domain whose e-mail works, as YunoHost's diagnosis says."
        help.fr = "Un domaine dont l'e-mail fonctionne, d'après le diagnostic de YunoHost."
        type = "domain"
        visible = "email_mode == 'yunohost'"

        [email.sending.email_host]
        ask.en = "Mail server (SMTP)"
        ask.fr = "Serveur mail (SMTP)"
        type = "string"
        example = "smtp.example.org"
        visible = "email_mode == 'custom'"

        [email.sending.email_port]
        ask.en = "Port"
        ask.fr = "Port"
        help.en = "Usually 587 with STARTTLS, 465 with TLS."
        help.fr = "En général 587 avec STARTTLS, 465 avec TLS."
        type = "number"
        min = 1
        max = 65535
        visible = "email_mode == 'custom'"

        [email.sending.email_security]
        ask.en = "Encryption"
        ask.fr = "Chiffrement"
        type = "select"
        choices.starttls = "STARTTLS"
        choices.ssl = "TLS"
        choices.none = "None"
        visible = "email_mode == 'custom'"

        [email.sending.email_user]
        ask.en = "Username"
        ask.fr = "Identifiant"
        type = "string"
        optional = true
        visible = "email_mode == 'custom'"

        [email.sending.email_password]
        ask.en = "Password"
        ask.fr = "Mot de passe"
        help.en = "Left empty, the one already saved is kept."
        help.fr = "Laissé vide, celui déjà enregistré est conservé."
        type = "password"
        optional = true
        visible = "email_mode == 'custom'"

        [email.sending.email_from]
        ask.en = "Sender address"
        ask.fr = "Adresse d'expédition"
        help.en = "Many providers only accept the address of the account above. Leave empty for noreply@ followed by this app's domain."
        help.fr = "Beaucoup de fournisseurs n'acceptent que l'adresse du compte ci-dessus. Laisser vide pour noreply@ suivi du domaine de l'app."
        type = "email"
        optional = true
        visible = "email_mode == 'custom'"

    [email.test]
    name.en = "Test"
    name.fr = "Test"

        [email.test.test_address]
        ask.en = "Address"
        ask.fr = "Adresse"
        type = "email"
        bind = "null"
        optional = true

        [email.test.send_test_email]
        ask.en = "Send a test e-mail"
        ask.fr = "Envoyer un e-mail de test"
        type = "button"
        enabled = "test_address"
